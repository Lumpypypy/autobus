<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation du Jeu de l'Autobus</title>
    <link rel="stylesheet" href="styles_simu.css">
</head>
<body>
    <h1>Simulation du Jeu de l'Autobus</h1>
    <div id="controls">
        <label for="numGames">Nombre de parties à simuler : </label>
        <input type="number" id="numGames" value="10" min="1">
        <br>
        <label for="simulationType">Type de simulation : </label>
        <select id="simulationType">
            <option value="probabilistic">Simulation probabiliste</option>
            <option value="random">Simulation aléatoire</option>
            <option value="player">Simulation joueur</option>
            <option value="comparative">Simulation comparative</option>
        </select>
        <br>
        <button id="startSimulation">Lancer la simulation</button>
    </div>
    <div id="results">
        <h2>Résultats de la simulation</h2>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Partie</th>
                    <th>Type</th>
                    <th>Gorgées</th>
                    <th>Coups joués</th>
                    <th>Erreurs</th>
                    <th>Poteaux</th>
                    <th>Cartes restantes</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id="summary">
            <h3>Résumé</h3>
            <table id="summaryTable">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Moyenne des gorgées</th>
                        <th>Moyenne des coups joués</th>
                        <th>Moyenne des erreurs</th>
                        <th>Moyenne des poteaux</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Probabiliste</td>
                        <td id="avgGorgeesProbabilistic">0</td>
                        <td id="avgMovesProbabilistic">0</td>
                        <td id="avgErrorsProbabilistic">0</td>
                        <td id="avgPoteauxProbabilistic">0</td>
                    </tr>
                    <tr>
                        <td>Aléatoire</td>
                        <td id="avgGorgeesRandom">0</td>
                        <td id="avgMovesRandom">0</td>
                        <td id="avgErrorsRandom">0</td>
                        <td id="avgPoteauxRandom">0</td>
                    </tr>
                    <tr>
                        <td>Joueur</td>
                        <td id="avgGorgeesPlayer">0</td>
                        <td id="avgMovesPlayer">0</td>
                        <td id="avgErrorsPlayer">0</td>
                        <td id="avgPoteauxPlayer">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="script_simu.js"></script>
</body>
</html>
